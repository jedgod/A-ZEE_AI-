# TEMPLATE (not applied). Oracle host: /etc/ssh/sshd_config.d/50-ollama-tunnel.conf. Applying it is a live change that needs separate approval.
# A dedicated, unprivileged account may ONLY open one reverse listener on the host's loopback. No shell, no TTY, no other forwarding.
Match User ollama-tunnel
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    PubkeyAuthentication yes
    AllowTcpForwarding remote
    PermitListen 127.0.0.1:11434
    GatewayPorts no
    PermitTTY no
    X11Forwarding no
    AllowAgentForwarding no
    PermitTunnel no
    PermitUserRC no
    ForceCommand /sbin/nologin
    ClientAliveInterval 15
    ClientAliveCountMax 3
