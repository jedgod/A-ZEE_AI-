# Public HTTPS gateway for azee-staging-local: DEFAULT DENY. Only the routes below reach the app; everything else is 404.
# /api/aztrade/introspect, /api/aztrade/ai, /api/aztrade/jwks, /api/admin, /api/operations, /api/staff, webhooks, the database
# and the AZTrade API are never routed. This container is on the edge network only (no path to introspect, aztrade-api or db).
worker_processes 1;
events { worker_connections 256; }
http {
  server_tokens off;
  limit_req_zone $binary_remote_addr zone=perip:5m rate=20r/s;
  log_format safe '$remote_addr "$request_method $uri" $status';   # $uri has no query string: tokens in URLs are never logged
  access_log /dev/stdout safe;
  error_log /dev/stderr warn;
  client_max_body_size 1m;

  server {
    listen 8443 ssl;
    http2 on;
    ssl_certificate     /etc/gateway-tls/cert.pem;
    ssl_certificate_key /etc/gateway-tls/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    limit_req zone=perip burst=40 nodelay;

    set $app http://app:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 60s;

    # explicit denials first (defence in depth; the default at the bottom already denies)
    location ~ ^/api/(admin|operations|staff|webhooks|v1|code-agent|connectors|payments|payment-methods)(/|$) { return 404; }
    location ~ ^/api/aztrade/(introspect|ai|jwks)(/|$) { return 404; }

    # approved pages and assets
    location = / { proxy_pass $app; }
    location /_next/ { proxy_pass $app; }
    location ~ ^/(login|signin|register|verify-email|forgot-password|reset-password|account|pricing)(/|$) { proxy_pass $app; }
    # approved APIs: sign-in/session, account, entitlements, chat, AZLinqext keyboard, AZTrade token minting for signed-in users
    location ~ ^/api/(auth|account|me|subscriptions|plans|chat|chats|linqext)(/|$) { proxy_pass $app; }
    location = /api/aztrade/token { proxy_pass $app; }

    location / { return 404; }
  }
}
