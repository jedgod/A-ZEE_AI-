<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'">
<title>AZTrade Paper Trading</title><link rel="stylesheet" href="./app.css"><script src="./app.js" defer></script></head>
<body><main><h1>AZTrade Paper Trading</h1><p>Virtual funds only. Account balances and orders come from the server.</p>
<button id="connect">Connect signed-in A-Zee session</button><button id="refresh" disabled>Refresh account</button><button id="disconnect">Disconnect</button>
<p id="status" role="status" aria-live="polite">Sign in to A-Zee on this origin, then connect.</p>
<h2>Paper account</h2><pre id="account">Not connected</pre>
<form id="order"><fieldset disabled id="fields"><legend>Place a paper order</legend>
<label>Symbol <input name="symbol" required maxlength="32" pattern="[A-Za-z0-9._/-]{1,32}"></label>
<label>Side <select name="side"><option>BUY</option><option>SELL</option></select></label>
<label>Shares <input name="shares" inputmode="decimal" required pattern="[0-9]+([.][0-9]{1,8})?"></label>
<button type="submit">Submit paper order</button></fieldset></form>
<button id="retry" disabled>Retry pending order</button><pre id="result" aria-live="polite"></pre>
</main></body></html>
